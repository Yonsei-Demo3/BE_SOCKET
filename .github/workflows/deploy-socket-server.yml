# .github/workflows/deploy-socket-server.yml

name: 'Deploy Socket Server to EC2'

on:
  push:
    branches:
      - dev  # 'dev' 브랜치에 푸시될 때 실행

jobs:
  # ------------------------------------
  # 1. CI (빌드 및 ECR 푸시)
  # ------------------------------------
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # (OIDC 인증용)
      contents: read

    steps:
      - name: Checkout (코드 가져오기)
        uses: actions/checkout@v4

      - name: AWS OIDC Role 로그인
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_IAM_ROLE_ARN }}
          aws-region: ap-northeast-2

      - name: AWS ECR 로그인
        uses: aws-actions/amazon-ecr-login@v2

      - name: Docker Buildx 설정 (QEMU)
        # (Arm -> Amd64 교차 빌드를 위한 설정)
        uses: docker/setup-qemu-action@v3

      - name: Docker Buildx 설정 (Builder)
        uses: docker/setup-buildx-action@v3

      - name: (★핵심★) Docker 빌드 및 ECR 푸시 (Amd64용)
        uses: docker/build-push-action@v5
        with:
          context: . # (Dockerfile이 있는 위치)
          push: true # (ECR로 푸시)
          tags: ${{ secrets.ECR_REPOSITORY_URI }}:latest
          platforms: linux/amd64 # (★ EC2용 Amd64로 교차 빌드)
          cache-from: type=inline
          cache-to: type=inline

  # ------------------------------------
  # 2. CD (EC2에 배포)
  # ------------------------------------
  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push # (1번 'build-and-push' 잡이 성공해야만 실행)
    permissions:
      id-token: write # (OIDC 토큰 발급 권한 필수)
      contents: read

    steps:
      - name: AWS OIDC Role 로그인
        # (ECR 로그인을 위해 여기서도 필요)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_IAM_ROLE_ARN }}
          aws-region: ap-northeast-2


      - name: EC2에 배포 스크립트 실행
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST_IP }}
          username: ${{ secrets.EC2_USERNAME }}

          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          
          script: |
            aws ecr get-login-password --region ap-northeast-2 | docker login --username AWS --password-stdin ${{ secrets.ECR_REPOSITORY_URI }}

            # 최신 이미지 PULL (필수)
            docker pull ${{ secrets.ECR_REPOSITORY_URI }}:latest

            # docker compose로 재시작 (필수)
            # (EC2에 있는 기존 docker-compose.yml과 .env 파일을 사용)
            docker compose up -d

            docker image prune -f